name: tests
# Every push and pull request: lint and the full test suite on the mock client (no API key, no network).
# Live evaluations (python -m app.batch / python -m app.stress) cost Meta credits and are run by hand before a release;
# their reports are kept in the README with dates.
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      # Runtime dependencies come from the hash-locked file: a changed or substituted package fails the install.
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install pytest==9.2.0 ruff==0.17.3
      - run: ruff check .
      - run: python -m pytest -q
      - name: Audit pinned dependencies for known vulnerabilities
        run: pip install pip-audit && pip-audit -r requirements.txt
